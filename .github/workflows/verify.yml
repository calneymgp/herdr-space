name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - run: make deps
      - run: make verify
      - run: make browser-deps
      - name: Use the official Ubuntu HTTPS mirror for browser dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: .tools/browser/node_modules/.bin/playwright install --with-deps chromium webkit
        timeout-minutes: 15
      - run: node tests/browser/smoke.mjs
      - run: node tests/browser/terminal-lifecycle.mjs --binary=.state/qa/fixture-server
      - run: node tests/browser/sw-migration.mjs
